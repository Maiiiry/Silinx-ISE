name: Pages
# The single-file edition (Silinx-ISE.html: no install, runs in the browser) published on GitHub
# Pages, so that a course page (e.g. Moodle, as a URL resource) can link to it:
#   https://pmnmalo.github.io/Silinx-ISE/
# Built from main after every CI run on main that passed (the commit CI tested; a release is a commit
# of main too), and on demand (Actions ▸ Pages ▸ Run workflow: main's latest commit). A CI run that
# failed or was cancelled (a newer push) publishes nothing: the site keeps the last commit that passed.
# (The github-pages environment deploys from main only.)
# (Uploading the HTML file to Moodle itself does not work: Moodle's filtering of uploaded HTML files
# removes its <script> tags and shows the code as text.)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # after CI: only when it passed on a push to main (not a pull request's run)
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # the commit CI tested (workflow_run), else main's latest commit
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - name: The commit published
        run: git log -1 --format='Publishing %h %s (%ci)'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the single-file edition
        run: node scripts/build-standalone.mjs
      - name: The site
        run: |
          mkdir -p site
          cp dist/Silinx-ISE.html site/index.html
          cp dist/Silinx-ISE.html site/Silinx-ISE.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
