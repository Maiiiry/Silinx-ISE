name: Pages
# The single-file edition (Silinx-ISE.html: no install, runs in the browser) published on GitHub
# Pages, so that a course page (e.g. Moodle, as a URL resource) can link to it:
#   https://pmnmalo.github.io/Silinx-ISE/       the stable edition: the latest release
#   https://pmnmalo.github.io/Silinx-ISE/dev/   the development edition: main, after every CI run
#                                               that passed (its title says "development, commit …";
#                                               its browser storage is its own)
# Built after every CI run on main that passed (the dev edition: the commit CI tested), after every
# release (the stable edition: its tag), and on demand (Actions ▸ Pages ▸ Run workflow). A CI run
# that failed or was cancelled (a newer push) publishes nothing: the site keeps what it had.
# (The github-pages environment deploys from main only: both editions are built in a run on main.)
# (Uploading the HTML file to Moodle itself does not work: Moodle's filtering of uploaded HTML files
# removes its <script> tags and shows the code as text.)
on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # after CI: when it passed on a push to main (not a pull request's run); after a release: when
    # it was published
    if: >-
      github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
      && (github.event.workflow_run.name == 'Release' || github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # the commit CI tested; after a release or on demand, main's latest commit
          ref: ${{ github.event.workflow_run.name == 'CI' && github.event.workflow_run.head_sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # the stable edition: the latest release's tag, built from its own checkout (its own scripts and
      # dependencies), at the root of the site
      - name: The latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Stable edition: $TAG ($(git rev-parse --short "$TAG^{commit}"))"
      - name: Build the stable edition (the site's root)
        run: |
          git worktree add --detach ../stable "${{ steps.release.outputs.tag }}"
          cd ../stable
          npm ci
          node scripts/build-standalone.mjs --site "$GITHUB_WORKSPACE/site"
      # the development edition: this commit of main, in dev/ (after the stable one: the root's build
      # empties the site folder first)
      - name: Build the development edition (dev/)
        run: |
          git log -1 --format='Development edition: %h %s (%ci)'
          npm ci
          node scripts/build-standalone.mjs --site site/dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
