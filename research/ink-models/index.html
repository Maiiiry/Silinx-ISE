<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink models spike</title>
<style>
  :root { --bg: #fafaf8; --fg: #1d1d1b; --muted: #6b6b66; --line: #d6d6d0; --accent: #2a5db0; --bad: #b3261e; --good: #1e7a3a; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 12px 16px 40px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .env { color: var(--muted); font-size: 13px; margin-bottom: 10px; word-break: break-word; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  button, select { font: inherit; min-height: 44px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--fg); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; }
  #status { color: var(--muted); font-size: 14px; }
  canvas { display: block; width: 100%; height: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; touch-action: none; }
  #answer { font: 18px/1.4 ui-monospace, monospace; white-space: pre-wrap; min-height: 2em; padding: 8px; border: 1px dashed var(--line); border-radius: 8px; background: #fff; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px; background: #fff; }
  th, td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  td.text { font-family: ui-monospace, monospace; white-space: pre-wrap; max-width: 420px; }
  td.num { text-align: right; white-space: nowrap; }
  .sum td { font-weight: 600; background: #f1f1ec; }
</style>
</head>
<body>
<!-- Spike: can a small vision model read hand-drawn expressions, truth tables and schematics in the
     browser? Not part of Silinx; see README.md. Copyright 2026 Pedro Maló, AGPL-3.0-only. -->
<main>
  <h1>Ink models spike</h1>
  <div class="env" id="env">…</div>

  <div class="row">
    <select id="model"></select>
    <select id="backend"><option value="webgpu">WebGPU</option><option value="wasm">WebAssembly</option></select>
    <button id="load" class="primary">Load model</button>
    <span id="status">Starting the worker…</span>
  </div>

  <div class="row">
    <select id="kind"><option value="expression">Expression</option><option value="table">Truth table</option><option value="schematic">Schematic</option></select>
    <button id="recognize" class="primary">Recognize</button>
    <button id="clear">Clear</button>
    <button id="save">Save PNG</button>
    <span id="samples"></span>
  </div>

  <canvas id="ink" width="1200" height="640"></canvas>
  <div class="row"><div id="answer" style="flex:1"></div></div>

  <div class="row">
    <button id="bench">Run the 10 samples</button>
    <button id="benchAll">Run every model</button>
    <button id="copy">Copy results</button>
    <button id="download">Save results</button>
    <button id="forget">Clear the model cache</button>
  </div>
  <div id="results"></div>
</main>
<script type="module" src="spike.js"></script>
</body>
</html>
